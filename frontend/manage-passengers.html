<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passengers · CabGo admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="nav"></header>
  <main class="wrap">
    <div class="page-head"><div><h1>Passengers</h1><p class="muted">View details and block or unblock accounts.</p></div></div>
    <div class="filters"><label class="field">Search <input id="q" type="search" placeholder="Name, email or mobile"></label></div>
    <div id="list"></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async () => {
      await CAB.page({ roles: ['ADMIN'] });
      const { api, $, h, fmt, badge, act } = CAB;
      let t;
      async function load() {
        const rows = await api(`/api/admin/passengers?q=${encodeURIComponent($('#q').value)}`);
        CAB.table($('#list'), [
          { label: 'Name', render: (r) => h('button', { class: 'btn small ghost', onclick: () => ADMIN.userDialog(r.user_id) }, r.name) },
          { label: 'Email', key: 'email' },
          { label: 'Mobile', render: (r) => h('span', { class: 'mono' }, r.mobile) },
          { label: 'Bookings', class: 'num', key: 'bookings' },
          { label: 'Spent', class: 'num', render: (r) => fmt.money(r.spent) },
          { label: 'Joined', render: (r) => fmt.day(r.created_at) },
          { label: 'Status', render: (r) => badge(r.status) },
          { label: '', render: (r) => {
              const block = r.status === 'ACTIVE';
              return h('button', { class: `btn small ${block ? 'danger' : ''}`, onclick: (e) => act(e.currentTarget, () => api(`/api/admin/users/${r.user_id}/status`, { method: 'PUT', body: { status: block ? 'BLOCKED' : 'ACTIVE' } }), load) }, block ? 'Block' : 'Unblock');
            } },
        ], rows, 'No passengers found.');
      }
      $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 250); });
      load();
    })();
  </script>
</body>
</html>
